{% extends 'base.html' %}

{% block start %}
  <div class="container mt-10">
    <h2>Rank: {{ queryset.first.student.studentreportcard.first.student_rank }}</h2>
    <h2>Total Marks: {{ total_marks.total_marks }}</h2>

    <table class="table">
      
      <tbody>
        {% for marks in queryset %}
          <tr>
            <th scope="row">{{ forloop.counter }}</th>
            <td>
              {{ marks.subject.subject_name }}
            </td>
            <td>{{ marks.marks }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>

  </div>
{% endblock %}
