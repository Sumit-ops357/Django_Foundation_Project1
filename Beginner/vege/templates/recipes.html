{% extends 'base.html' %}

{% block start %}
  <div class="container mt-10">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}

      <h2>Add Recipe</h2>
      <hr />
      <div class="mb-3">
        <label for="exampleInputEmail1" class="form-label">Recipe Name</label>
        <input name="recipe_name" required type="text" class="form-control" />
      </div>
      <div class="mb-3">
        <label for="exampleInputPassword1" class="form-label">Recipe Description</label>
        <textarea name="recipe_description" required class="form-control"></textarea>
      </div>
      <div class="mb-3">
        <label for="exampleInputPassword1" class="form-label">Recipe Image</label>
        <input name="recipe_image" type="file" class="form-control" />
      </div>

      <button type="submit" class="btn-solid theme-success">Add Recipe</button>
    </form>

    <div class="mt-10">
      <form method="GET">
        <div class="mb-3">
          <label class="form-label">Search Recipe</label>
          <input name="search" type="text" class="form-control" />
        </div>

        <button type="submit" class="btn btn-primary">Search</button>
      </form>
    </div>

    <table class="table mt-10">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Recipe name</th>
          <th scope="col">Recipe description</th>
          <th scope="col">Recipe image</th>
          <th scope="col">Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for recipe in recipes %}
          <tr>
            <th scope="row">{{ forloop.counter }}</th>
            <td>{{ recipe.recipe_name }}</td>
            <td>{{ recipe.recipe_description }}</td>
            <td>
              <img src="/media/{{ recipe.recipe_image }}" style="height : 200px" />
            </td>
            <td>
              <a href="/delete-recipe/{{ recipe.id }}/" class="btn btn-danger">Delete</a>
              <a href="/update-recipe/{{ recipe.id }}/" class="btn btn-primary">Update</a>
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
